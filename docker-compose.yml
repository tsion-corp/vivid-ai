x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://vivid:vivid@postgres:5432/vivid
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: vivid
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  # The smoke test needs a session without a real inbox. Dev only.
  ALLOW_PASSWORD_AUTH: ${ALLOW_PASSWORD_AUTH:-true}
  DECANE_APP_ID: ${DECANE_APP_ID:-}
  DECANE_VERIFICATION_KEY: ${DECANE_VERIFICATION_KEY:-}
  DECANE_PARTNER_TOKEN: ${DECANE_PARTNER_TOKEN:-}
  # RunPod model services — set these in a root .env (see .env.example)
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-8192}
  MAX_REPLY_TOKENS: ${MAX_REPLY_TOKENS:-4096}
  HISTORY_TOKEN_BUDGET: ${HISTORY_TOKEN_BUDGET:-5500}
  LLM_MODEL: ${LLM_MODEL:-RedHatAI/gemma-3-27b-it-quantized.w4a16}
  ASR_BASE_URL: ${ASR_BASE_URL:-}
  TTS_BASE_URL: ${TTS_BASE_URL:-}
  TRANSLATE_BASE_URL: ${TRANSLATE_BASE_URL:-}
  EMBEDDINGS_URL: ${EMBEDDINGS_URL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-advanced}
  SEARCH_QUERY_VARIANTS: ${SEARCH_QUERY_VARIANTS:-3}
  RERANKER_URL: ${RERANKER_URL:-}
  SANDBOX_URL: http://sandbox:8080
  VIVID_TOOLS_URL: http://vivid-tools:8005
  VIVID_TOOLS_TOKEN: ${BROWSER_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vivid
      POSTGRES_PASSWORD: vivid
      POSTGRES_DB: vivid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivid"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browser automation (Playwright) for the agent's browse tools. Needs
  # outbound internet; its own SSRF guard blocks private targets.
  # vivid-tools:
  #   build: ./vivid-tools
  #   environment:
  #     BROWSER_TOKEN: ${BROWSER_TOKEN:-}
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Executes model-generated code. Deliberately: no secrets, no internet
  # (internal-only network), read-only fs, capped memory/pids/cpu.
  sandbox:
    build: ./sandbox
    networks:
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=96m
    mem_limit: 1536m
    pids_limit: 128
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./vivid-backend
      # BuildKit's bridge network has flaked on this machine (PyPI DNS/timeouts);
      # the host path is reliable.
      network: host
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    volumes:
      - ./vivid-backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - default
      - sandbox_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  worker:
    build: ./vivid-backend
    command: arq app.workers.worker.WorkerSettings
    environment:
      <<: *backend-env
    volumes:
      - ./vivid-backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # frontend:
  #   build:
  #     context: ./vivid-frontend
  #     target: dev
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./vivid-frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   environment:
  #     # Browser → backend directly (REST + the chat websocket)
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000
  #     - NEXT_PUBLIC_DECANE_API_KEY=${DECANE_API_KEY:-}
  #     - NEXT_PUBLIC_DECANE_APP_ID=${DECANE_APP_ID:-}
  #     # Server-side route handlers → backend inside the compose network
  #     - VIVID_API_BASE_URL=http://backend:8000
  #   depends_on:
  #     - backend

volumes:
  pgdata:
  miniodata:

networks:
  sandbox_net:
    internal: true
